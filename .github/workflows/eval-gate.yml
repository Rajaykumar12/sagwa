# Sagwa dogfooding its own action (PRD FR-23, FR-24).
#
# On a push to main this publishes a baseline; on a PR it gates against that
# baseline, so the check answers "is this PR worse than main?" — not just
# "does this run clear a fixed threshold?".
#
# The target is a real pipeline on real data: Lead-3 extractive summarization
# over the CNN/DailyMail golden set (benchmarks/offline.py). It is offline and
# deterministic, so it needs no API key, costs nothing per PR, and any change
# in the verdict is caused by the PR. Judge/RAGAS metrics are not gated here
# (config/gates.ci.yaml); to gate an LLM target, point `target`/`dataset` at it
# and pass `GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}` as env.
name: eval-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  actions: read # required to read the baseline artifact from another workflow run

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ # the action at the repo root
        with:
          target: benchmarks.offline:LeadSummarizer
          dataset: golden_sets/cnndm.jsonl
          gates-config: config/gates.ci.yaml
