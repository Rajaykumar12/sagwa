# Sagwa dogfooding its own action (PRD FR-23, FR-24).
#
# On a push to main this publishes a baseline; on a PR it gates against that
# baseline, so the check answers "is this PR worse than main?" — not just
# "does this run clear a fixed threshold?".
#
# CAVEAT (docs/STATUS.md): this still evaluates the `stub` target, because a
# real target needs a GROQ_API_KEY secret and a token budget per run. Point
# `target`/`dataset` at benchmarks.adapters:HotpotV1 + golden_sets/hotpotqa.jsonl
# once that secret exists — nothing else here changes.
name: eval-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  actions: read # required to read the baseline artifact from another workflow run

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ # the action at the repo root
        with:
          target: stub
          dataset: golden_sets/example.jsonl
          gates-config: config/gates.ci.yaml
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
